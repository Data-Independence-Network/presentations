<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Платформа «Турбаза» — Просмотр Белых Книг и Документов</title>

  <!-- Typography & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- KaTeX for Mathematical Formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- Mermaid.js for Vector Architecture & Sequence Diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Marked.js for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Offline Docs Content Bundle (fallback for file:// protocol) -->
  <script src="shared_docs/docs_bundle.js"></script>

  <style>
    :root {
      /* Dark Sovereign Palette (Default) */
      --bg-dark: #070b14;
      --bg-surface: #0e1626;
      --bg-card: #121c32;
      --bg-card-hover: #17243f;
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-focus: rgba(56, 189, 248, 0.5);
      --gold: #facc15;
      --gold-dim: rgba(250, 204, 21, 0.15);
      --cyan: #38bdf8;
      --cyan-dim: rgba(56, 189, 248, 0.14);
      --emerald: #10b981;
      --emerald-dim: rgba(16, 185, 129, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --code-bg: #090e1a;
      --code-border: #1e293b;
      --table-stripe: rgba(255, 255, 255, 0.03);
      --toc-active-bg: rgba(56, 189, 248, 0.12);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="light"] {
      /* Clean Academic Paper Palette */
      --bg-dark: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --border-subtle: #cbd5e1;
      --border-focus: #0284c7;
      --gold: #b45309;
      --gold-dim: #fef3c7;
      --cyan: #0284c7;
      --cyan-dim: #e0f2fe;
      --emerald: #059669;
      --emerald-dim: #d1fae5;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #64748b;
      --code-bg: #f1f5f9;
      --code-border: #cbd5e1;
      --table-stripe: #f8fafc;
      --toc-active-bg: #e0f2fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Reading Progress Bar */
    .progress-bar-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: transparent;
      z-index: 1000;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      transition: width 0.1s linear;
    }

    /* ==================== TOP NAVIGATION ==================== */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 900;
      background: rgba(14, 22, 38, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    [data-theme="light"] .top-nav {
      background: rgba(255, 255, 255, 0.92);
      border-bottom-color: var(--border-subtle);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .nav-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: var(--transition);
    }
    .nav-back-btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      transform: translateX(-2px);
    }

    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: var(--gold-dim);
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid rgba(250, 204, 21, 0.35);
    }

    .doc-picker-select {
      background: var(--bg-dark);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-sans);
      max-width: 420px;
      cursor: pointer;
      outline: none;
      transition: var(--transition);
    }
    .doc-picker-select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
    }
    .status-draft {
      background: rgba(250, 204, 21, 0.12);
      color: var(--gold);
      border: 1px solid rgba(250, 204, 21, 0.35);
    }
    .status-ready {
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.45);
    }
    .status-dot-green {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 6px var(--emerald);
      animation: pulse-dot 2s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-main);
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-action:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .btn-pdf-accent {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff !important;
      border: none;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }
    .btn-pdf-accent:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-icon-toggle {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      cursor: pointer;
      font-size: 16px;
      transition: var(--transition);
    }
    .btn-icon-toggle:hover {
      border-color: var(--cyan);
    }

    /* ==================== MAIN WORKSPACE LAYOUT ==================== */
    .workspace-layout {
      display: flex;
      max-width: 1480px;
      margin: 0 auto;
      padding: 28px 24px 80px;
      gap: 36px;
      position: relative;
    }

    /* Sidebar / Outline */
    .sidebar-toc {
      width: 320px;
      flex-shrink: 0;
      position: sticky;
      top: 80px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: var(--transition);
    }
    .sidebar-header {
      font-size: 13px;
      font-weight: 800;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
    }
    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .toc-item a {
      display: block;
      padding: 6px 10px;
      border-radius: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      line-height: 1.4;
      transition: var(--transition);
    }
    .toc-item a:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
    }
    .toc-item.active a {
      background: var(--toc-active-bg);
      color: var(--cyan);
      font-weight: 700;
      border-left: 3px solid var(--cyan);
    }
    .toc-item.level-1 a { font-weight: 700; }
    .toc-item.level-2 a { padding-left: 18px; font-size: 12.5px; }
    .toc-item.level-3 a { padding-left: 28px; font-size: 12px; color: var(--text-dim); }

    /* Main Article / Reading View */
    .article-container {
      flex: 1;
      max-width: 920px;
      min-width: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 48px 56px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
    }
    [data-theme="light"] .article-container {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    /* ==================== TYPOGRAPHY & MARKDOWN STYLING ==================== */
    .markdown-body {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text-main);
    }

    .markdown-body h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-top: 10px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--cyan);
      color: var(--text-main);
    }

    .markdown-body h2 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-top: 40px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-main);
    }

    .markdown-body h3 {
      font-size: 19px;
      font-weight: 700;
      margin-top: 28px;
      margin-bottom: 12px;
      color: var(--cyan);
    }

    .markdown-body h4 {
      font-size: 16px;
      font-weight: 700;
      margin-top: 20px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .markdown-body p {
      margin-bottom: 18px;
    }

    .markdown-body strong {
      font-weight: 700;
      color: var(--text-main);
    }

    .markdown-body a {
      color: var(--cyan);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: var(--transition);
    }
    .markdown-body a:hover {
      color: var(--gold);
    }

    .markdown-body ul, .markdown-body ol {
      margin-left: 26px;
      margin-bottom: 20px;
    }
    .markdown-body li {
      margin-bottom: 6px;
    }

    .markdown-body hr {
      border: none;
      height: 1px;
      background: var(--border-subtle);
      margin: 36px 0;
    }

    /* Page Break Marker (Simulated A4 Boundary) */
    .pagebreak-marker {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 40px 0;
      color: var(--text-dim);
      font-size: 11px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .pagebreak-marker::before,
    .pagebreak-marker::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
      border-top: 1px dashed var(--border-subtle);
    }

    /* Tables */
    .table-wrapper {
      overflow-x: auto;
      margin: 24px 0;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      line-height: 1.5;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-subtle);
      padding: 10px 14px;
      text-align: left;
    }
    .markdown-body th {
      background: var(--bg-card);
      font-weight: 700;
      color: var(--cyan);
      font-family: var(--font-sans);
    }
    .markdown-body tr:nth-child(even) {
      background: var(--table-stripe);
    }

    /* Code Blocks */
    .code-card {
      position: relative;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 8px;
      margin: 22px 0;
      overflow: hidden;
    }
    .code-card pre {
      padding: 16px 20px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.5;
      color: #38bdf8;
    }
    [data-theme="light"] .code-card pre {
      color: #0369a1;
    }
    .code-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: var(--transition);
    }
    .code-copy-btn:hover {
      background: var(--cyan);
      color: #070b14;
    }

    .markdown-body code:not(pre code) {
      background: var(--code-bg);
      border: 1px solid var(--border-subtle);
      color: var(--cyan);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 13.5px;
    }

    /* ASCII Diagrams */
    .ascii-card {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 8px;
      padding: 16px 20px;
      margin: 22px 0;
      overflow-x: auto;
    }
    .ascii-card pre {
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.35;
      color: var(--text-main);
      white-space: pre;
    }

    /* Mermaid Diagrams */
    .mermaid-container {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 24px;
      margin: 28px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
    }
    .mermaid-container .mermaid {
      width: 100%;
      text-align: center;
    }
    .mermaid svg {
      max-width: 100%;
      height: auto;
    }

    /* Blockquotes & Callouts */
    .markdown-body blockquote {
      background: rgba(56, 189, 248, 0.08);
      border-left: 4px solid var(--cyan);
      padding: 14px 20px;
      border-radius: 0 8px 8px 0;
      margin: 22px 0;
      font-size: 15px;
      color: var(--text-main);
    }
    .markdown-body blockquote.callout-risk {
      background: rgba(250, 204, 21, 0.1);
      border-left-color: var(--gold);
      color: var(--text-main);
    }
    .markdown-body blockquote.callout-cbr {
      background: rgba(2, 132, 199, 0.12);
      border-left-color: #0284c7;
    }

    /* KaTeX Math Blocks */
    .math-display {
      display: flex;
      justify-content: center;
      margin: 22px 0;
      overflow-x: auto;
      padding: 12px 0;
    }

    /* Floating Back to Top Button */
    .btn-back-top {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      z-index: 500;
    }
    .btn-back-top.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .btn-back-top:hover {
      background: var(--cyan);
      color: #070b14;
      transform: translateY(-3px);
    }

    /* Fallback / Error Alert Card */
    .fallback-card {
      background: rgba(250, 204, 21, 0.08);
      border: 1.5px solid var(--gold);
      border-radius: 12px;
      padding: 24px;
      margin: 20px 0;
    }
    .fallback-title {
      font-weight: 800;
      color: var(--gold);
      font-size: 17px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Responsive */
    @media (max-width: 1080px) {
      .sidebar-toc { display: none; }
      .sidebar-toc.open-mobile {
        display: flex;
        position: fixed;
        top: 60px;
        left: 0;
        width: 100%;
        max-height: 60vh;
        z-index: 800;
        border-radius: 0 0 14px 14px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      }
      .article-container { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <!-- Reading Progress Bar -->
  <div class="progress-bar-container">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>

  <!-- Top Sticky Navigation -->
  <header class="top-nav">
    <div class="nav-left">
      <a href="index.html" class="nav-back-btn" title="Вернуться на главный портал презентаций">

      </a>

      <div class="nav-brand">

    <div class="nav-right">

      <!-- Primary Action: PDF download if available -->
      <a id="btnDownloadPdf" href="shared_docs/whitepapers/06_cbr_smart_contracts_fsm_whitepaper.pdf" target="_blank" class="btn-action btn-pdf-accent" title="Открыть готовый полиграфический PDF A4">

      </a>

      <!-- Secondary Action: Open Raw Markdown -->
      <a id="btnRawMd" href="shared_docs/whitepapers/06_cbr_smart_contracts_fsm_whitepaper.md" target="_blank" class="btn-action" title="Просмотреть исходный Markdown-файл">
        <span>📝</span>
        <span>.md</span>
      </a>

      <!-- Toggle Theme (Dark Sovereign / Paper Light) -->
      <button id="btnThemeToggle" class="btn-icon-toggle" title="Переключить тему (тёмная / бумага)">
        ☀️
      </button>

      <!-- Toggle Outline (Mobile) -->
      <button id="btnOutlineToggle" class="btn-icon-toggle" title="Оглавление документа" style="display: none;">
        📑
      </button>
    </div>
  </header>

  <!-- Workspace Container -->
  <main class="workspace-layout">
    
    <!-- Left Sticky Sidebar: Table of Contents -->
    <aside class="sidebar-toc" id="sidebarToc">
      <div class="sidebar-header">
        <span>Оглавление документа</span>
        <span style="font-size: 11px; color: var(--text-dim);" id="tocCount">0 глав</span>
      </div>
      <ul class="toc-list" id="tocList">
        <li class="toc-item"><span style="color: var(--text-dim); font-size: 12px;">Загрузка структуры...</span></li>
      </ul>
    </aside>

    <!-- Main Content Canvas -->
    <article class="article-container">
      <div class="markdown-body" id="docContent">
        <p style="color: var(--text-muted); font-size: 15px;">Загрузка документа платформы «Турбаза»...</p>
      </div>
    </article>

  </main>

  <!-- Back to Top Button -->
  <button id="btnBackTop" class="btn-back-top" title="Наверх">↑</button>

  <!-- App Script -->
  <script>
    (function() {
      // Registered documents registry
      const DOCS_METADATA = {
        'shared_docs/whitepapers/01_platform_overview_whitepaper.md': {
          title: 'Белая книга 01: Концептуальный обзор платформы',
          isReady: false,
          pdf: null,
          badgeText: '📐 В разработке',
          badgeClass: 'status-draft'
        },
        'shared_docs/whitepapers/02_applications_suite_whitepaper.md': {
          title: 'Белая книга 02: Пакет флагманских прикладных решений',
          isReady: false,
          pdf: null,
          badgeText: '📐 В разработке',
          badgeClass: 'status-draft'
        },
        'shared_docs/whitepapers/03_engineering_architecture_whitepaper.md': {
          title: 'Белая книга 03: Инженерная спецификация архитектуры',
          isReady: false,
          pdf: null,
          badgeText: '📐 В разработке',
          badgeClass: 'status-draft'
        },
        'shared_docs/whitepapers/04_ecosystem_impact_whitepaper.md': {
          title: 'Белая книга 04: Экосистемный анализ стейкхолдеров',
          isReady: false,
          pdf: null,
          badgeText: '📐 В разработке',
          badgeClass: 'status-draft'
        },
        'shared_docs/whitepapers/05_sovereign_governance_whitepaper.md': {
          title: 'Белая книга 05: Суверенное управление и регуляторный контур',
          isReady: false,
          pdf: null,
          badgeText: '📐 В разработке',
          badgeClass: 'status-draft'
        },
        'shared_docs/whitepapers/06_cbr_smart_contracts_fsm_whitepaper.md': {
          title: 'Белая книга 06: Смарт-контракты Банка России и FSM O(1)',
          isReady: true,
          pdf: 'shared_docs/whitepapers/06_cbr_smart_contracts_fsm_whitepaper.pdf',
          badgeText: 'Готово (PDF A4)',
          badgeClass: 'status-ready'
        },
        'shared_docs/Технический документ платформы Турбаза.md': {
          title: 'Технический документ платформы «Турбаза»',
          isReady: false,
          pdf: 'shared_docs/Технический документ платформы Турбаза.pdf',
          badgeText: '📐 В разработке',
          badgeClass: 'status-draft'
        }
      };

      const docSelector = document.getElementById('docSelector');
      const docContent = document.getElementById('docContent');
      const tocList = document.getElementById('tocList');
      const tocCount = document.getElementById('tocCount');
      const docStatusBadge = document.getElementById('docStatusBadge');
      const btnDownloadPdf = document.getElementById('btnDownloadPdf');
      const btnRawMd = document.getElementById('btnRawMd');
      const progressBar = document.getElementById('progressBar');
      const btnBackTop = document.getElementById('btnBackTop');
      const btnThemeToggle = document.getElementById('btnThemeToggle');
      const btnOutlineToggle = document.getElementById('btnOutlineToggle');
      const sidebarToc = document.getElementById('sidebarToc');

      // Theme toggle handling
      let currentTheme = localStorage.getItem('turbase_theme') || 'dark';
      function applyTheme(theme) {
        currentTheme = theme;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('turbase_theme', theme);
        btnThemeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        btnThemeToggle.title = theme === 'dark' ? 'Светлая тема (бумага)' : 'Тёмная тема (портал)';
      }
      applyTheme(currentTheme);

      btnThemeToggle.addEventListener('click', () => {
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
      });

      // Responsive outline toggle
      if (window.innerWidth <= 1080) {
        btnOutlineToggle.style.display = 'inline-flex';
      }
      window.addEventListener('resize', () => {
        btnOutlineToggle.style.display = window.innerWidth <= 1080 ? 'inline-flex' : 'none';
      });
      btnOutlineToggle.addEventListener('click', () => {
        sidebarToc.classList.toggle('open-mobile');
      });

      // Scroll Progress & Back to Top
      window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
        progressBar.style.width = Math.min(100, Math.max(0, progress)) + '%';

        if (scrollTop > 300) {
          btnBackTop.classList.add('visible');
        } else {
          btnBackTop.classList.remove('visible');
        }

        // Scrollspy for TOC
        updateActiveTocOnScroll();
      });

      btnBackTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // Determine initial document from URL query string ?doc=...
      function getRequestedDoc() {
        const params = new URLSearchParams(window.location.search);
        const docParam = params.get('doc');
        if (docParam && DOCS_METADATA[docParam]) {
          return docParam;
        }
        // If query doc param not matched exactly, try finding matching key
        if (docParam) {
          const match = Object.keys(DOCS_METADATA).find(k => k.includes(docParam) || docParam.includes(k));
          if (match) return match;
        }
        // Default to whitepaper 06 (the only finalized publication PDF)
        return 'shared_docs/whitepapers/06_cbr_smart_contracts_fsm_whitepaper.md';
      }

      // Load and Render Document
      async function loadDocument(docPath) {
        const meta = DOCS_METADATA[docPath] || {
          title: docPath.split('/').pop().replace('.md', ''),
          isReady: false,
          pdf: null,
          badgeText: '📐 Документ',
          badgeClass: 'status-draft'
        };

        // Update Nav UI
        docSelector.value = docPath;
        btnRawMd.href = docPath;
        document.title = `${meta.title} — Платформа «Турбаза»`;

        // Update status badge
        docStatusBadge.className = `status-pill ${meta.badgeClass}`;
        if (meta.isReady) {
          docStatusBadge.innerHTML = `<span class="status-dot-green"></span><span>${meta.badgeText}</span>`;
        } else {
          docStatusBadge.innerHTML = `<span>${meta.badgeText}</span>`;
        }

        // Update PDF Button
        if (meta.pdf) {
          btnDownloadPdf.style.display = 'inline-flex';
          btnDownloadPdf.href = meta.pdf;
          btnDownloadPdf.innerHTML = `<span>📄</span><span>${meta.isReady ? 'PDF (15 стр.)' : 'PDF'}</span>`;
        } else {
          btnDownloadPdf.style.display = 'none';
        }

        // Update URL without full reload
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('doc', docPath);
        window.history.replaceState({}, '', newUrl);

        docContent.innerHTML = `<p style="color: var(--text-muted); padding: 40px 0; text-align: center;">Загрузка текста документа...</p>`;

        let markdownText = null;
        try {
          const response = await fetch(docPath);
          if (response.ok) {
            markdownText = await response.text();
          }
        } catch (err) {
          // Normal fallback for file:// or network restrictions
        }

        // Check preloaded offline bundle
        if (!markdownText && window.TURBASE_DOCS_BUNDLE && window.TURBASE_DOCS_BUNDLE[docPath]) {
          markdownText = window.TURBASE_DOCS_BUNDLE[docPath];
        }

        if (markdownText) {
          renderMarkdownDocument(markdownText, meta);
        } else {
          renderFallbackUi(docPath, meta, new Error('Document fetch failed and not found in offline bundle'));
        }
      }

      // Transform and render markdown
      function renderMarkdownDocument(markdown, meta) {
        // Strip YAML frontmatter if present
        let cleanMd = markdown;
        if (cleanMd.startsWith('---')) {
          const endIdx = cleanMd.indexOf('---', 3);
          if (endIdx !== -1) {
            cleanMd = cleanMd.substring(endIdx + 3).trim();
          }
        }

        // Pre-processing:
        // 1. Stash Mermaid code blocks
        const mermaidBlocks = [];
        cleanMd = cleanMd.replace(/```mermaid\s*([\s\S]*?)```/g, (match, code) => {
          const id = `___MERMAID_PLACEHOLDER_${mermaidBlocks.length}___`;
          mermaidBlocks.push(code.trim());
          return id;
        });

        // 2. Stash math display blocks ($$...$$)
        const mathBlocks = [];
        cleanMd = cleanMd.replace(/\$\$([\s\S]*?)\$\$/g, (match, code) => {
          const id = `___MATH_DISPLAY_${mathBlocks.length}___`;
          mathBlocks.push(code.trim());
          return id;
        });

        // 3. Stash inline math ($...$)
        const mathInline = [];
        cleanMd = cleanMd.replace(/\$([^\$\n]+?)\$/g, (match, code) => {
          const id = `___MATH_INLINE_${mathInline.length}___`;
          mathInline.push(code.trim());
          return id;
        });

        // 4. Transform page breaks into aesthetic divider
        cleanMd = cleanMd.replace(/<!--\s*pagebreak\s*-->/gi, '\n\n<div class="pagebreak-marker">Граница страницы A4</div>\n\n');

        // 5. Parse with Marked.js
        let html = '';
        if (window.marked && typeof window.marked.parse === 'function') {
          html = window.marked.parse(cleanMd, { gfm: true, breaks: false });
        } else {
          // Minimal fallback parser if CDN failed
          html = cleanMd
            .replace(/^# (.*$)/gim, '<h1>$1</h1>')
            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
            .replace(/\n\n/g, '</p><p>');
          html = `<p>${html}</p>`;
        }

        // 6. Restore Math Display
        html = html.replace(/___MATH_DISPLAY_(\d+)___/g, (m, idx) => {
          const formula = mathBlocks[parseInt(idx, 10)];
          return `<div class="math-display">$$${formula}$$</div>`;
        });

        // 7. Restore Math Inline
        html = html.replace(/___MATH_INLINE_(\d+)___/g, (m, idx) => {
          const formula = mathInline[parseInt(idx, 10)];
          return `<span class="math-inline">$${formula}$</span>`;
        });

        // 8. Restore Mermaid Diagrams
        html = html.replace(/___MERMAID_PLACEHOLDER_(\d+)___/g, (m, idx) => {
          const code = mermaidBlocks[parseInt(idx, 10)];
          return `<div class="mermaid-container"><div class="mermaid">${escapeHtml(code)}</div></div>`;
        });

        // 9. Wrap tables in responsive wrapper
        html = html.replace(/<table>([\s\S]*?)<\/table>/g, '<div class="table-wrapper"><table>$1</table></div>');

        // 10. Add copy buttons to code blocks
        html = html.replace(/<pre><code([^>]*)>([\s\S]*?)<\/code><\/pre>/g, (m, attrs, code) => {
          return `
            <div class="code-card">
              <button class="code-copy-btn" onclick="copyCodeBlock(this)">Копировать</button>
              <pre><code${attrs}>${code}</code></pre>
            </div>`;
        });

        // Inject into canvas
        docContent.innerHTML = html;

        // Render KaTeX
        if (window.renderMathInElement) {
          window.renderMathInElement(docContent, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            throwOnError: false
          });
        }

        // Render Mermaid
        if (window.mermaid) {
          try {
            window.mermaid.initialize({
              startOnLoad: false,
              theme: currentTheme === 'dark' ? 'dark' : 'default',
              themeVariables: currentTheme === 'dark' ? {
                darkMode: true,
                background: '#121c32',
                primaryColor: '#0e1626',
                primaryTextColor: '#38bdf8',
                primaryBorderColor: '#38bdf8',
                lineColor: '#38bdf8'
              } : {
                primaryColor: '#e0f2fe',
                primaryTextColor: '#0284c7',
                primaryBorderColor: '#0284c7',
                lineColor: '#0284c7'
              }
            });
            window.mermaid.run({
              nodes: docContent.querySelectorAll('.mermaid')
            });
          } catch (e) {
            console.warn('[!] Mermaid render note:', e);
          }
        }

        // Build Table of Contents
        buildTableOfContents();
      }

      // Build Table of Contents from rendered headings
      function buildTableOfContents() {
        const headings = docContent.querySelectorAll('h1, h2, h3');
        tocList.innerHTML = '';

        if (headings.length === 0) {
          tocList.innerHTML = '<li class="toc-item"><span style="color: var(--text-dim); font-size: 12px;">Заголовки отсутствуют</span></li>';
          tocCount.textContent = '0 глав';
          return;
        }

        tocCount.textContent = `${headings.length} глав`;

        headings.forEach((heading, idx) => {
          if (!heading.id) {
            heading.id = 'heading-' + idx + '-' + heading.textContent.trim().toLowerCase().replace(/[^a-zа-я0-9]+/gi, '-');
          }

          const level = heading.tagName.toLowerCase() === 'h1' ? 1 : heading.tagName.toLowerCase() === 'h2' ? 2 : 3;
          const li = document.createElement('li');
          li.className = `toc-item level-${level}`;
          li.dataset.targetId = heading.id;

          const a = document.createElement('a');
          a.href = '#' + heading.id;
          a.textContent = heading.textContent.trim();
          a.addEventListener('click', (e) => {
            e.preventDefault();
            heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
            if (sidebarToc.classList.contains('open-mobile')) {
              sidebarToc.classList.remove('open-mobile');
            }
          });

          li.appendChild(a);
          tocList.appendChild(li);
        });
      }

      // Highlight active heading in TOC
      function updateActiveTocOnScroll() {
        const headings = docContent.querySelectorAll('h1, h2, h3');
        const scrollPosition = window.scrollY + 100;

        let activeId = null;
        headings.forEach(heading => {
          if (heading.offsetTop <= scrollPosition) {
            activeId = heading.id;
          }
        });

        const items = tocList.querySelectorAll('.toc-item');
        items.forEach(item => {
          if (item.dataset.targetId === activeId) {
            item.classList.add('active');
          } else {
            item.classList.remove('active');
          }
        });
      }

      // Fallback UI when fetch fails (e.g. direct file:// browser restriction)
      function renderFallbackUi(docPath, meta, error) {
        docContent.innerHTML = `
          <div class="fallback-card">
            <div class="fallback-title">
              <span>⚠️</span>
              <span>Локальное ограничение браузера (CORS на file://)</span>
            </div>
            <p style="margin-bottom: 14px; font-size: 14.5px;">
              Браузер ограничил автоматическое чтение файла <code>${escapeHtml(docPath)}</code> при прямом открытии через <code>file://</code> протокол.
            </p>
            <div style="background: var(--bg-card); padding: 14px 18px; border-radius: 8px; margin-bottom: 16px; font-size: 13.5px; font-family: var(--font-mono); border: 1px solid var(--border-subtle);">
              💡 <strong>Рекомендуемое решение:</strong> запустите локальный веб-сервер платформы:<br/>
              <span style="color: var(--cyan);">./start_presentation.sh</span><br/>
              и откройте портал по адресу <a href="http://localhost:8080/viewer.html?doc=${encodeURIComponent(docPath)}" style="color: var(--gold);">http://localhost:8080/</a>
            </div>
            <p style="font-size: 14px; margin-bottom: 12px;">Либо выберите файл прямо с диска вручную:</p>
            <input type="file" id="localFileInput" accept=".md,.txt" style="display: block; margin-bottom: 12px; font-size: 13px;" />
            <div style="display: flex; gap: 10px; margin-top: 14px;">
              <a href="${docPath}" target="_blank" class="btn-action">
                <span>📝</span>
                <span>Открыть исходный .md файл</span>
              </a>
              ${meta.pdf ? `
              <a href="${meta.pdf}" target="_blank" class="btn-action btn-pdf-accent">
                <span>📄</span>
                <span>Открыть готовый PDF</span>
              </a>` : ''}
            </div>
          </div>
        `;

        const localFileInput = document.getElementById('localFileInput');
        if (localFileInput) {
          localFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
              renderMarkdownDocument(evt.target.result, meta);
            };
            reader.readAsText(file);
          });
        }
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Global copy helper for code blocks
      window.copyCodeBlock = function(btn) {
        const pre = btn.parentElement.querySelector('pre');
        if (!pre) return;
        navigator.clipboard.writeText(pre.innerText).then(() => {
          const orig = btn.textContent;
          btn.textContent = 'Скопировано!';
          btn.style.background = 'var(--emerald)';
          btn.style.color = '#070b14';
          setTimeout(() => {
            btn.textContent = orig;
            btn.style.background = '';
            btn.style.color = '';
          }, 2000);
        });
      };

      // Handle selector change
      docSelector.addEventListener('change', (e) => {
        loadDocument(e.target.value);
      });

      // Initial Load
      const initialDoc = getRequestedDoc();
      loadDocument(initialDoc);

    })();
  </script>
</body>
</html>
