<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена | Платформа «Турбаза»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #070b14;
      --bg-card: rgba(14, 22, 38, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --gold: #facc15;
      --cyan: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.12) 0%, rgba(7, 11, 20, 0) 60%),
        radial-gradient(circle at 80% 80%, rgba(250, 204, 21, 0.08) 0%, rgba(7, 11, 20, 0) 50%);
    }
    .error-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(250, 204, 21, 0.12);
      border: 1.5px solid var(--gold);
      padding: 6px 14px;
      border-radius: 20px;
      color: var(--gold);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .error-desc {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px -4px rgba(16, 185, 129, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="brand-pill">
      <span>🏔️</span>
      <span>ТУРБАЗА</span>
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">Страница не найдена</h1>
    <p class="error-desc">
      Запрашиваемая презентация или документ перемещены или не существуют. 
      Перейдите в единый каталог платформы, чтобы выбрать нужный раздел.
    </p>
    <div class="actions-row">
      <a href="index.html" class="btn-action btn-primary">
        <span>🏠</span>
        <span>Вернуться на Главный Портал</span>
      </a>
      <a href="viewer.html" class="btn-action btn-secondary">
        <span>📑</span>
        <span>Каталог Белых Книг</span>
      </a>
      <a href="https://github.com/Data-Independence-Network/presentations" target="_blank" rel="noopener noreferrer" class="btn-action btn-secondary">
        <span>GitHub ↗</span>
      </a>
    </div>
  </div>
</body>
</html>
